name: Deploy to Firebase Hosting

# Rebuilds the site + Tina admin and deploys to Firebase whenever content or
# code lands on main. TinaCloud saves commit to main, so editor changes go live
# automatically without anyone running a local build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site + Tina admin
        # Trim any stray whitespace/newlines from the pasted secrets — a trailing
        # newline in TINA_CLIENT_ID otherwise breaks the generated client URL.
        run: |
          export TINA_CLIENT_ID="$(printf '%s' "$TINA_CLIENT_ID_RAW" | tr -d '[:space:]')"
          export TINA_TOKEN="$(printf '%s' "$TINA_TOKEN_RAW" | tr -d '[:space:]')"
          export TINA_BRANCH="main"
          npm run build:cms
        env:
          TINA_CLIENT_ID_RAW: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN_RAW: ${{ secrets.TINA_TOKEN }}

      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@latest deploy --only hosting:marketing --project forge-website-b276c --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
