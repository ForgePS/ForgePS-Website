name: Deploy to Firebase Hosting

# Publishes the Forge CMS site (cms-live/) to forge-website-b276c.
# Saves and image uploads depend on the Storage and Firestore rules shipped
# with that folder, so this deploy includes those rules.

on:
  push:
    branches:
      - main
      - cursor/fix-cms-save-uploads-5f1b
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy hosting, Storage rules, and Firestore rules
        working-directory: cms-live
        run: npx -y firebase-tools@15.23.0 deploy --only hosting,storage,firestore:rules --project forge-website-b276c --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
